name: Build DropConvert APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install libraries
        run: npm install --no-audit --no-fund

      - name: Copy libraries into the app
        run: node build-web.js

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add the app icon
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Add the save-to-Downloads helper and allow big files
        run: |
          cp native/MainActivity.java native/SaveFilePlugin.java android/app/src/main/java/com/dropconvert/app/
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "largeHeap" android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DropConvert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DropConvert-APK
          path: DropConvert.apk

      - name: Put the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: DropConvert APK (build ${{ github.run_number }})
          body: Download DropConvert.apk below, open it on your phone and tap Install.
          files: DropConvert.apk
